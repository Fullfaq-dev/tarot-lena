name: Fetch VPS logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: Number of log lines
        required: false
        default: "200"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy yclid parser
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "scripts/export_yclid.py"
          target: "/tmp/yclid-export-src"
          overwrite: true

      - name: Fetch API logs over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/tarot-lena
            python3 /tmp/yclid-export-src/scripts/export_yclid.py 2>/dev/null \
              || python3 /tmp/yclid-export-src/export_yclid.py
