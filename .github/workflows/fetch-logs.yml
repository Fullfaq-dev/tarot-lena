name: Fetch VPS logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: Number of log lines
        required: false
        default: "200"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch API logs over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/tarot-lena
            LINES="${{ github.event.inputs.lines }}"
            echo "=== yclid 28/Sep/2026 ==="
            echo "-- host /var/log/nginx --"
            ls -la /var/log/nginx 2>/dev/null || echo "(no /var/log/nginx)"
            echo -n "host access.log exact: "
            grep "28/Sep/2026" /var/log/nginx/access.log 2>/dev/null | grep -c "yclid=" || echo 0
            echo -n "host access.log* zgrep: "
            zgrep -h "28/Sep/2026" /var/log/nginx/access.log* 2>/dev/null | grep -c "yclid=" || echo 0
            echo "-- find access/yclid files --"
            find /var/log /opt/tarot-lena /var/lib/docker/containers -name '*access*' -o -name '*nginx*' 2>/dev/null | head -80 || true
            echo "-- docker nginx files --"
            docker compose -f docker-compose.prod.yml exec -T nginx sh -c 'ls -la /var/log/nginx; echo ---; grep -c yclid= /var/log/nginx/access.log 2>/dev/null; echo ---; grep "28/Sep/2026" /var/log/nginx/access.log 2>/dev/null | grep -c yclid=' || true
            echo "-- docker compose nginx logs 28.09 --"
            echo -n "yclid in docker nginx logs (28/Sep/2026): "
            docker compose -f docker-compose.prod.yml logs nginx --no-color 2>/dev/null | grep "28/Sep/2026" | grep -c "yclid=" || echo 0
            echo -n "total nginx lines 28/Sep/2026: "
            docker compose -f docker-compose.prod.yml logs nginx --no-color 2>/dev/null | grep -c "28/Sep/2026" || echo 0
            echo -n "unique yclid values 28/Sep/2026: "
            docker compose -f docker-compose.prod.yml logs nginx --no-color 2>/dev/null | grep "28/Sep/2026" | grep -oE 'yclid=[^[:space:]&"]+' | sort -u | wc -l
            echo "-- sample yclid lines --"
            docker compose -f docker-compose.prod.yml logs nginx --no-color 2>/dev/null | grep "28/Sep/2026" | grep "yclid=" | head -20 || true
            echo "-- journalctl --"
            journalctl --since "2026-09-28 00:00:00" --until "2026-09-29 00:00:00" -u nginx --no-pager 2>/dev/null | grep -c "yclid=" || echo "(no journal nginx)"
            echo "=== docker compose ps ==="
            docker compose -f docker-compose.prod.yml ps -a
            echo "=== disk & memory ==="
            df -h / | tail -n +1
            free -h | sed -n '1,2p'
            echo "=== api logs ==="
            docker compose -f docker-compose.prod.yml logs api --tail="$LINES" 2>&1 || true
            echo "=== nginx logs ==="
            docker compose -f docker-compose.prod.yml logs nginx --tail=40 2>&1 || true
            echo "=== bot logs (tail 40) ==="
            docker compose -f docker-compose.prod.yml logs bot --tail=40 2>&1 || true
            echo "=== in-container health ==="
            docker compose -f docker-compose.prod.yml exec -T api curl -sv http://127.0.0.1:8000/health 2>&1 | tail -30 || true
